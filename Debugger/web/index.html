<title>Debugger</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Debugger">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: one full-bleed game canvas; menu, HUD, results and shop are DOM layers over it.
   Single-theme by design: the kitchen-floor cartoon world looks the same in light and dark. */
:root {
  --outline: #291a14;
  --roach: #a63321;
  --cream: #fff8e3;
  --tile: #fcf2d6;
  --gold: #ffc726;
  --green: #61bd42;
  --blue: #388ff2;
  --locked: #9e948a;
  --shade: rgba(20, 10, 6, 0.42);
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
body {
  background: #f0deb5;
  color: var(--outline);
  font-family: var(--body);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

.layer {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));
  gap: 14px;
}
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.dim { background: var(--shade); }
.passthrough { pointer-events: none; }
.passthrough .hit { pointer-events: auto; }

/* Cartoon text: dark outline built from shadows so it works everywhere. */
.toon {
  font-family: var(--display); color: #fff; line-height: 1; letter-spacing: 0.01em;
  text-shadow:
    3px 0 0 var(--outline), -3px 0 0 var(--outline), 0 3px 0 var(--outline), 0 -3px 0 var(--outline),
    2px 2px 0 var(--outline), -2px 2px 0 var(--outline), 2px -2px 0 var(--outline), -2px -2px 0 var(--outline),
    0 7px 0 var(--outline);
}

.btn {
  position: relative; border: 4px solid var(--outline); border-radius: 22px;
  background: var(--c, var(--roach)); color: #fff;
  font-family: var(--display); font-size: 26px; letter-spacing: 0.03em;
  padding: 12px 24px; min-width: min(250px, 100%);
  box-shadow: 0 6px 0 var(--outline);
  text-shadow: 0 2px 0 rgba(41, 26, 20, 0.55);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform 0.08s, box-shadow 0.08s;
}
.btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--outline); }
.btn[disabled] { --c: var(--locked); cursor: default; }
.btn[disabled]:active { transform: none; box-shadow: 0 6px 0 var(--outline); }
.btn small { display: block; font-family: var(--body); font-size: 13px; font-weight: 900; letter-spacing: 0.04em; }
.btn.sm { font-size: 20px; min-width: 160px; padding: 9px 20px; }

.panel {
  background: var(--cream); border: 4px solid var(--outline); border-radius: 24px;
  box-shadow: 0 6px 0 var(--outline); padding: 16px 18px;
  width: 100%; max-width: 360px;
}
.coin {
  display: inline-grid; place-items: center; width: 24px; height: 24px; flex: none;
  border-radius: 50%; background: var(--gold); border: 3px solid var(--outline);
  font: 900 13px/1 var(--body); color: rgba(41, 26, 20, 0.75);
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.5);
}
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--cream); border: 3px solid var(--outline); border-radius: 999px;
  padding: 4px 14px 4px 6px; font: 900 20px/1 var(--body);
  font-variant-numeric: tabular-nums;
}

/* Menu */
#menu .top { width: 100%; display: flex; justify-content: space-between; align-items: center; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--outline);
  background: var(--cream); color: var(--outline); display: grid; place-items: center;
  box-shadow: 0 3px 0 var(--outline); padding: 0;
}
.icon-btn svg { width: 22px; height: 22px; }
.title-block { transform: rotate(-4deg); text-align: center; margin-top: auto; }
.title-block h1 { margin: 0; font-size: clamp(52px, 16vw, 76px); color: var(--roach); font-weight: 400; }
.title-block p { margin: 6px 0 0; font-size: 21px; }
#mascot { width: min(230px, 56vw); height: min(230px, 56vw); flex: none; }
.level-card { display: flex; align-items: center; gap: 12px; padding: 10px 16px; }
.level-card canvas { width: 44px; height: 44px; flex: none; }
.level-card .meta { flex: 1; min-width: 0; }
.eyebrow { font: 900 12px/1.2 var(--body); letter-spacing: 0.08em; color: var(--roach); text-transform: uppercase; }
.level-card .name { font: 900 20px/1.2 var(--body); }
.stars { display: flex; gap: 2px; align-items: flex-end; }
.stars svg { width: 26px; height: 26px; }
.stars.big svg { width: 54px; height: 54px; }
.stars.big svg:nth-child(2) { transform: translateY(-8px); }
.menu-buttons { display: flex; flex-direction: column; gap: 16px; align-items: center; width: 100%; margin-bottom: auto; }

/* HUD */
#hud { gap: 10px; }
#hud .row { width: 100%; display: flex; align-items: center; justify-content: space-between; }
.pause-btn { background: var(--roach); color: #fff; }
.timer { padding: 4px 16px; font-size: 26px; gap: 6px; }
.timer svg { width: 20px; height: 20px; }
.timer.urgent { background: var(--roach); color: #fff; animation: throb 1s infinite; }
@keyframes throb { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.08); } }
.quota { width: 100%; display: flex; align-items: center; gap: 8px; }
.quota canvas { width: 32px; height: 32px; flex: none; }
.bar { position: relative; flex: 1; height: 26px; border: 3px solid var(--outline); border-radius: 999px; background: var(--cream); overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--green); transition: width 0.2s; }
.bar b { position: relative; display: block; text-align: center; font: 900 15px/20px var(--body); font-variant-numeric: tabular-nums; }
#hud .bottom { margin-top: auto; align-items: flex-end; }
.hint {
  background: rgba(255, 248, 227, 0.94); border: 3px solid var(--outline); border-radius: 14px;
  padding: 8px 12px; font: 900 15px/1.5 var(--body); transition: opacity 0.4s;
}
.hint span { color: var(--roach); }
.meter { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.tank { position: relative; width: 24px; height: 100px; border: 3px solid var(--outline); border-radius: 999px; background: var(--cream); overflow: hidden; }
.tank i { position: absolute; inset: auto 0 0 0; height: 100%; background: var(--green); }
.meter canvas { width: 46px; height: 46px; }

/* Overlays */
.center { justify-content: center; }
.countdown-num { font-size: 120px; color: var(--gold); animation: pop 0.35s cubic-bezier(.2, 1.6, .4, 1); }
@keyframes pop { from { transform: scale(2.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.intro { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.intro h2 { margin: 0; font: 900 30px/1.1 var(--body); text-wrap: balance; }
.intro p { margin: 0; font: 800 17px/1.35 var(--body); color: rgba(41, 26, 20, 0.8); text-wrap: balance; }
.intro .controls { display: flex; gap: 16px; justify-content: center; color: var(--roach); font-weight: 900; font-size: 15px; margin-top: 4px; }
.banner { font-size: clamp(54px, 17vw, 80px); transform: rotate(-6deg); animation: bannerpop 0.5s cubic-bezier(.2, 1.6, .4, 1) both; text-align: center; }
@keyframes bannerpop { from { transform: rotate(-6deg) scale(0.4); opacity: 0; } to { transform: rotate(-6deg) scale(1); opacity: 1; } }

/* Results */
#results h2 { margin: 12px 0 0; font-size: clamp(42px, 13vw, 58px); font-weight: 400; transform: rotate(-3deg); text-align: center; }
.rows { display: flex; flex-direction: column; gap: 9px; }
.r { display: flex; align-items: center; gap: 6px; font: 800 17px/1.2 var(--body); }
.r .v { margin-left: auto; font-weight: 900; font-size: 19px; font-variant-numeric: tabular-nums; }
.r.total { font-weight: 900; font-size: 20px; border-top: 2px solid rgba(41, 26, 20, 0.2); padding-top: 10px; }
.r.total .v { font-size: 26px; }
.note { font: 900 14px/1.35 var(--body); color: var(--roach); text-align: center; }
.result-buttons { display: flex; flex-direction: column; align-items: center; gap: 16px; padding-top: 6px; width: 100%; }

/* Shop */
#shop { background: var(--tile); z-index: 5; }
.shop-head { width: 100%; max-width: 360px; display: flex; justify-content: space-between; align-items: center; padding-top: 8px; }
.shop-head h2 { margin: 0; font-size: 40px; font-weight: 400; color: var(--blue); }
.card { display: flex; flex-direction: column; gap: 14px; }
.card .head { display: flex; gap: 14px; align-items: center; }
.card .ico { width: 66px; height: 66px; flex: none; border-radius: 50%; background: #fff; border: 3px solid var(--outline); display: grid; place-items: center; }
.card .ico canvas { width: 58px; height: 58px; }
.card .tname { font: 900 21px/1.15 var(--body); }
.pips { display: flex; gap: 5px; margin-top: 5px; }
.pips i { width: 22px; height: 10px; border-radius: 999px; border: 2px solid var(--outline); background: rgba(158, 148, 138, 0.35); }
.pips i.on { background: var(--gold); }
.stat { display: flex; align-items: center; gap: 6px; font: 800 15px/1.2 var(--body); font-variant-numeric: tabular-nums; }
.stat .now { margin-left: auto; font-weight: 900; font-size: 16px; }
.stat .next { font-weight: 900; font-size: 16px; color: #3f8f27; }
.maxed { text-align: center; font: 400 24px/1 var(--display); color: var(--gold); text-shadow: 1px 1px 0 var(--outline), -1px 1px 0 var(--outline), 1px -1px 0 var(--outline), -1px -1px 0 var(--outline); }
.link-btn { background: none; border: 0; font: 800 14px var(--body); color: rgba(41, 26, 20, 0.55); text-decoration: underline; padding: 8px; }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; font: 800 14px var(--body); }
.confirm button { border: 3px solid var(--outline); border-radius: 12px; padding: 6px 12px; font-weight: 900; background: var(--cream); }
.confirm .danger { background: var(--roach); color: #fff; }

@media (prefers-reduced-motion: reduce) {
  .countdown-num, .banner, .timer.urgent { animation: none; }
}
</style>

<canvas id="stage" aria-label="Kitchen floor with bugs. Tap to swat, drag to spray."></canvas>

<!-- MENU -->
<section id="menu" class="layer">
  <div class="top">
    <button class="icon-btn" id="muteBtn" aria-label="Sound on"></button>
    <span class="pill"><span class="coin">$</span><span id="menuCoins">0</span></span>
  </div>
  <div class="title-block">
    <h1 class="toon">DEBUGGER</h1>
    <p class="toon">squash 'em fast!</p>
  </div>
  <canvas id="mascot"></canvas>
  <div class="panel level-card">
    <canvas data-bug="roach"></canvas>
    <div class="meta">
      <div class="eyebrow">Level 1</div>
      <div class="name">Kitchen Panic</div>
    </div>
    <div class="stars" id="menuStars"></div>
  </div>
  <div class="menu-buttons">
    <button class="btn" style="--c: var(--green)" id="playBtn">PLAY</button>
    <button class="btn" style="--c: var(--blue)" id="menuShopBtn">UPGRADES</button>
  </div>
</section>

<!-- HUD -->
<section id="hud" class="layer passthrough" hidden>
  <div class="row">
    <button class="icon-btn pause-btn hit" id="pauseBtn" aria-label="Pause">
      <svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg>
    </button>
    <span class="pill timer" id="timer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="13" r="8.5"/><path d="M12 8.5V13l3 2M9.5 2.5h5"/></svg>
      <span id="timerText">40</span>
    </span>
    <span class="pill"><span class="coin">$</span><span id="hudCoins">0</span></span>
  </div>
  <div class="quota">
    <canvas data-bug="roach"></canvas>
    <div class="bar"><i id="quotaFill"></i><b id="quotaText">0 / 30</b></div>
  </div>
  <div class="row bottom">
    <div class="hint" id="hint">Tap to <span>SWAT</span><br>Drag to <span>SPRAY</span></div>
    <div class="meter">
      <div class="tank"><i id="tankFill"></i></div>
      <canvas id="hudCan"></canvas>
    </div>
  </div>
</section>

<!-- COUNTDOWN -->
<section id="countdown" class="layer dim center passthrough" hidden>
  <div class="panel intro">
    <div class="eyebrow">Level 1</div>
    <h2>Kitchen Panic</h2>
    <p>Squash 30 bugs in 40 seconds!</p>
    <div class="controls"><span>Tap = swat</span><span>Drag = spray</span></div>
  </div>
  <div class="toon countdown-num" id="countNum">3</div>
</section>

<!-- BANNER -->
<section id="bannerLayer" class="layer center passthrough" hidden>
  <div class="toon banner" id="banner">SWAT!</div>
</section>

<!-- PAUSE -->
<section id="pause" class="layer dim center" hidden>
  <div class="toon" style="font-size: 52px">PAUSED</div>
  <button class="btn" style="--c: var(--green)" id="resumeBtn">RESUME</button>
  <button class="btn" id="quitBtn">QUIT TO MENU</button>
</section>

<!-- RESULTS -->
<section id="results" class="layer dim scroll" hidden>
  <h2 class="toon" id="resTitle">LEVEL CLEAR!</h2>
  <div class="stars big" id="resStars"></div>
  <div class="panel rows" id="resStats"></div>
  <div class="panel rows" id="resCoins"></div>
  <div class="result-buttons">
    <button class="btn" style="--c: var(--blue)" id="resShopBtn">UPGRADES <span class="coin">$</span><span id="resWallet">0</span></button>
    <button class="btn" style="--c: var(--green)" id="againBtn">PLAY AGAIN</button>
    <button class="btn" id="nextBtn" disabled><span>NEXT LEVEL<small>coming soon</small></span></button>
    <button class="btn sm" id="resMenuBtn">MENU</button>
  </div>
</section>

<!-- SHOP -->
<section id="shop" class="layer scroll" hidden>
  <div class="shop-head">
    <h2 class="toon">UPGRADES</h2>
    <span class="pill"><span class="coin">$</span><span id="shopCoins">0</span></span>
  </div>
  <div class="panel card" id="card-swatter"></div>
  <div class="panel card" id="card-spray"></div>
  <button class="btn" style="--c: var(--green)" id="shopDone">DONE</button>
  <div id="resetArea"><button class="link-btn" id="resetBtn">Reset progress</button></div>
</section>

<script>
"use strict";
// ---------------------------------------------------------------- data
const PAL = {
  outline: "#291a14", roachRed: "#a63321", roachBody: "#5c2417", roachHead: "#4d1c14", roachStripe: "#42170f",
  goo: "#ccd952", gooOutline: "#6b7a1a", gold: "#ffc726", green: "#61bd42",
};
const KINDS = {
  roach:  { hp: 1, speed: [70, 105], scale: 1, reward: 5, life: [6, 9], turn: 4, pause: 0.25,
            colors: { legs: PAL.roachRed, body: PAL.roachBody, pro: PAL.roachRed, head: PAL.roachHead, stripe: PAL.roachStripe } },
  big:    { hp: 3, speed: [45, 65], scale: 1.4, reward: 15, life: [9, 12], turn: 2.5, pause: 0.15,
            colors: { legs: "#8c291a", body: "#451a12", pro: "#85261a", head: "#33120d", stripe: "#2e0f0a" } },
  zoomer: { hp: 1, speed: [150, 190], scale: 0.78, reward: 10, life: [4, 6], turn: 6, pause: 0.35,
            colors: { legs: "#cc7833", body: "#8f5426", pro: "#d68f45", head: "#6b3b1a", stripe: "#6b3b1a" } },
};
const SWATTERS = [
  { name: "Rolled-Up Newspaper", radius: 38, damage: 1.0, color: "#dbd6c7" },
  { name: "Plastic Swatter",     radius: 46, damage: 1.5, color: "#388ff2" },
  { name: "Wire Mesh Swatter",   radius: 54, damage: 2.0, color: "#ed5945" },
  { name: "Double Swatter",      radius: 64, damage: 3.0, color: "#945cdb" },
  { name: "Mega Swatter 9000",   radius: 76, damage: 4.0, color: "#ffc229" },
];
const SPRAYS = [
  { name: "Old Spray Can",  tank: 2.5, dps: 1.2, cloud: 34, refill: 0.35, color: "#73c74d" },
  { name: "Bug-B-Gone",     tank: 3.5, dps: 1.6, cloud: 40, refill: 0.45, color: "#4dbf8c" },
  { name: "Toxic Mist",     tank: 4.5, dps: 2.1, cloud: 46, refill: 0.55, color: "#9ecc2e" },
  { name: "Fog Blaster",    tank: 6.0, dps: 2.8, cloud: 54, refill: 0.70, color: "#40b3cc" },
  { name: "Nuclear Nozzle", tank: 8.0, dps: 3.6, cloud: 62, refill: 0.90, color: "#bff233" },
];
const COSTS = { swatter: [60, 150, 300, 550], spray: [80, 180, 350, 600] };
const LEVEL = {
  number: 1, title: "Kitchen Panic", duration: 40, quota: 30,
  spawnStart: 1.0, spawnEnd: 0.45, maxAlive: 14,
  rules: [{ kind: "roach", after: 0, w: 6 }, { kind: "big", after: 8, w: 1.5 }, { kind: "zoomer", after: 16, w: 2 }],
  completionBonus: 100, timePerSecond: 5, threeStar: 14, twoStar: 6,
};

// ---------------------------------------------------------------- save (this browser only)
const SAVE_KEY = "debugger.save.v1";
let save = { coins: 0, swatter: 0, spray: 0, stars: 0, muted: false };
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || "{}")); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

// ---------------------------------------------------------------- helpers
const rand = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
function angleDiff(a, b) { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function ell(g, x, y, w, h) { g.beginPath(); g.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, TAU); }
function rrect(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function rot(px, py, ox, oy, a) { const dx = px - ox, dy = py - oy, c = Math.cos(a), s = Math.sin(a); return [ox + dx * c - dy * s, oy + dx * s + dy * c]; }
const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------- art (same shapes as the iPhone app)
const LEGS = [[9, -12, 26, -20, 22, -36, 0], [11, 1, 30, -2, 36, 12, Math.PI], [11, 11, 28, 18, 30, 40, 0]];
function drawRoach(g, col, lp, splayed, flash) {
  const O = PAL.outline;
  g.lineCap = "round"; g.lineJoin = "round";
  g.beginPath();
  for (const L of LEGS) for (const side of [1, -1]) {
    const sw = splayed ? 0 : Math.sin(lp + L[6] + (side < 0 ? Math.PI : 0)) * 0.32;
    const sp = splayed ? 1.18 : 1;
    const ax = L[0] * side, ay = L[1];
    const k = rot(L[2] * side * sp, L[3], ax, ay, sw * side), f = rot(L[4] * side * sp, L[5], ax, ay, sw * side);
    g.moveTo(ax, ay); g.quadraticCurveTo(k[0], k[1], f[0], f[1]);
  }
  g.strokeStyle = O; g.lineWidth = 6; g.stroke();
  g.strokeStyle = col.legs; g.lineWidth = 3.2; g.stroke();
  const w = splayed ? 0 : Math.sin(lp * 0.5) * 4;
  g.beginPath();
  g.moveTo(4, -30); g.quadraticCurveTo(6, -60, 30 + w, -66);
  g.moveTo(-4, -30); g.quadraticCurveTo(-6, -58, -30 + w, -64);
  g.strokeStyle = O; g.lineWidth = 4.5; g.stroke();
  g.strokeStyle = col.legs; g.lineWidth = 2.2; g.stroke();
  ell(g, -9.5, -35, 19, 14); g.fillStyle = col.head; g.fill(); g.strokeStyle = O; g.lineWidth = 2.2; g.stroke();
  if (!splayed) { g.fillStyle = O; ell(g, -5, -32, 2.4, 2.4); g.fill(); ell(g, 2.6, -32, 2.4, 2.4); g.fill(); }
  ell(g, -14, -12, 28, 46); g.fillStyle = col.body; g.fill(); g.lineWidth = 2.4; g.stroke();
  g.save(); g.translate(1.5, 14); g.rotate(-0.08); ell(g, -1.8, -14, 3.6, 30); g.fillStyle = col.stripe; g.fill(); g.restore();
  ell(g, -15.5, -27, 31, 23); g.fillStyle = col.pro; g.fill(); g.strokeStyle = O; g.stroke();
  ell(g, -9, -23, 8, 4.5); g.fillStyle = "rgba(255,255,255,0.28)"; g.fill();
  ell(g, -9, -6, 5, 12); g.fillStyle = "rgba(255,255,255,0.12)"; g.fill();
  if (flash > 0) {
    g.fillStyle = `rgba(255,255,255,${Math.min(0.75, flash * 0.75)})`;
    ell(g, -14, -12, 28, 46); g.fill(); ell(g, -15.5, -27, 31, 23); g.fill();
  }
}
function drawBug(g, kind, x, y, heading, lp, flash, extra) {
  const k = KINDS[kind], s = k.scale * (extra || 1);
  g.save(); g.translate(x, y); g.rotate(heading + Math.PI / 2); g.scale(s, s);

  g.fillStyle = "#fcf2d6";

// ---------------------------------------------------------------- sound (synthesized, starts after first tap)
let audio = null;
function sfx(type) {
  if (save.muted) return;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const t = audio.currentTime, gain = audio.createGain(); gain.connect(audio.destination);
    if (type === "swat") {
      const len = 0.08, buf = audio.createBuffer(1, audio.sampleRate * len, audio.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
      const src = audio.createBufferSource(); src.buffer = buf;
      const f = audio.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 1400;
      src.connect(f); f.connect(gain); gain.gain.value = 0.5; src.start(t);
    } else if (type === "squish") {
      const o = audio.createOscillator(); o.type = "square";
      o.frequency.setValueAtTime(320, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.12);
      gain.gain.setValueAtTime(0.12, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
      o.connect(gain); o.start(t); o.stop(t + 0.15);
    } else if (type === "win" || type === "lose") {
      const notes = type === "win" ? [523, 659, 784, 1047] : [392, 330, 262];
      notes.forEach((n, i) => {
        const o = audio.createOscillator(), gg = audio.createGain(); o.type = "triangle"; o.frequency.value = n;
        gg.gain.setValueAtTime(0.0001, t + i * 0.12); gg.gain.exponentialRampToValueAtTime(0.18, t + i * 0.12 + 0.02);
        gg.gain.exponentialRampToValueAtTime(0.001, t + i * 0.12 + 0.25);
        o.connect(gg); gg.connect(audio.destination); o.start(t + i * 0.12); o.stop(t + i * 0.12 + 0.3);
      });
    } else if (type === "tick") {
      const o = audio.createOscillator(); o.frequency.value = 880;
      gain.gain.setValueAtTime(0.08, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      o.connect(gain); o.start(t); o.stop(t + 0.09);

}

// ---------------------------------------------------------------- game engine
const SPLAT_LIFE = 4, SWAT_DUR = 0.25, POPUP_LIFE = 0.9;
class Game {
  constructor(W, H) {
    this.W = W; this.H = H;
    this.swatter = SWATTERS[save.swatter]; this.spray = SPRAYS[save.spray];
    this.phase = "countdown"; this.countdown = 3; this.timeLeft = LEVEL.duration; this.elapsed = 0;
    this.kills = 0; this.escaped = 0; this.bounty = 0; this.combo = 0; this.bestCombo = 0;
    this.tank = this.spray.tank; this.spraying = false;
    this.bugs = []; this.splats = []; this.swats = []; this.puffs = []; this.popups = [];
    this.spawnTimer = 0.3; this.lastKill = -10; this.puffTimer = 0; this.sprayIdle = 0;
    this.finishTimer = 0; this.reported = false;
    this.sprayPointer = null; this.touchStart = null; this.touchPoint = null;
  }
  get sprayFraction() { return this.tank / this.spray.tank; }

  pointerDown(id, x, y) {
    if (this.sprayPointer === null) { this.sprayPointer = id; this.touchStart = { x, y }; this.touchPoint = { x, y }; this.spraying = false; }
    this.swat(x, y);
  }
  pointerMove(id, x, y) {
    if (id !== this.sprayPointer) return;

  }
  pointerUp(id) {
    if (id !== this.sprayPointer) return;
    this.sprayPointer = null; this.touchStart = null; this.touchPoint = null; this.spraying = false;
  }

  swat(x, y) {
    if (this.phase !== "playing") return;
    this.swats.push({ x, y, radius: this.swatter.radius, color: this.swatter.color, tilt: rand(-0.7, -0.3), age: 0 });
    sfx("swat");
    for (let i = this.bugs.length - 1; i >= 0; i--) {
      const b = this.bugs[i];
      if (Math.hypot(b.x - x, b.y - y) >= this.swatter.radius + b.radius * 0.5) continue;
      b.hp -= this.swatter.damage; b.flash = 1; b.pauseT = 0; b.panic = 0.8;
      b.target = Math.atan2(b.y - y, b.x - x);
      if (b.hp <= 0) { this.bugs.splice(i, 1); this.registerKill(b); }
    }
  }

  tick(dt) {
    if (this.phase === "paused") return;
    if (this.phase === "countdown") {
      const before = Math.ceil(this.countdown);
      this.countdown -= dt;
      if (Math.ceil(this.countdown) !== before && this.countdown > 0) sfx("tick");
      if (this.countdown <= 0) { this.phase = "playing"; ui.onPlaying(); }
      return;
    }
    if (this.phase === "playing") {
      this.elapsed += dt; this.timeLeft = Math.max(0, this.timeLeft - dt);
      this.updateSpawning(dt); this.updateSpray(dt); this.updateBugs(dt); this.mistDamage(dt); this.updateEffects(dt);
      if (this.kills >= LEVEL.quota) this.finish(true);
      else if (this.timeLeft <= 0) this.finish(false);
      return;
    }
    this.updateBugs(dt); this.updateEffects(dt);
    this.finishTimer += dt;
    if (this.finishTimer > 1.6 && !this.reported) { this.reported = true; ui.showResults(this.result()); }
  }

  updateSpawning(dt) {
    this.spawnTimer -= dt;
    if (this.spawnTimer > 0) return;
    const p = Math.min(1, this.elapsed / LEVEL.duration);
    this.spawnTimer = (LEVEL.spawnStart + (LEVEL.spawnEnd - LEVEL.spawnStart) * p) * rand(0.7, 1.3);
    if (this.bugs.filter((b) => !b.leaving).length >= LEVEL.maxAlive) return;
    const n = p > 0.5 && Math.random() < 0.3 ? 2 : 1;
    for (let i = 0; i < n; i++) this.spawn();
  }
  pickKind() {
    const opts = LEVEL.rules.filter((r) => this.elapsed >= r.after);
    let roll = Math.random() * opts.reduce((s, r) => s + r.w, 0);
    for (const o of opts) { if (roll < o.w) return o.kind; roll -= o.w; }
    return "roach";
  }
  spawn() {
    const kind = this.pickKind(), k = KINDS[kind], W = this.W, H = this.H, m = 40;
    let x, y;
    switch (Math.floor(Math.random() * 4)) {
      case 0: x = rand(0, W); y = -m; break;
      case 1: x = W + m; y = rand(0, H); break;
      case 2: x = rand(0, W); y = H + m; break;
      default: x = -m; y = rand(0, H);
    }
    const h = Math.atan2(rand(H * 0.25, H * 0.75) - y, rand(W * 0.25, W * 0.75) - x);
    this.bugs.push({ kind, x, y, heading: h, target: h, speed: rand(k.speed[0], k.speed[1]), hp: k.hp,
      life: rand(k.life[0], k.life[1]), age: 0, lp: 0, flash: 0, wander: 0.5, pauseT: 0, panic: 0,
      entered: false, leaving: false, inMist: false, radius: 24 * k.scale });
  }
  edgeHeading(x, y) {

    return opts.reduce((a, b) => (b[0] < a[0] ? b : a))[1];
  }
  updateBugs(dt) {
    const W = this.W, H = this.H, cx = W / 2, cy = H / 2, keep = [];
    for (const b of this.bugs) {
      const k = KINDS[b.kind];
      b.age += dt; b.flash = Math.max(0, b.flash - dt * 4); b.panic = Math.max(0, b.panic - dt);
      if (b.x > 0 && b.x < W && b.y > 0 && b.y < H) b.entered = true;
      if (!b.leaving && b.age > b.life) { b.leaving = true; b.target = this.edgeHeading(b.x, b.y); }
      if (b.pauseT > 0) { b.pauseT -= dt; }
      else {
        b.wander -= dt;
        if (b.wander <= 0) {
          b.wander = rand(0.4, 1.2);
          if (b.leaving) b.target = this.edgeHeading(b.x, b.y) + rand(-0.3, 0.3);
          else if (b.panic <= 0) { b.target = b.heading + rand(-1, 1); if (Math.random() < k.pause) b.pauseT = rand(0.25, 0.6); }
        }
        if (!b.leaving) {
          const inward = Math.atan2(cy - b.y, cx - b.x), e = 26;
          const near = b.x < e || b.x > W - e || b.y < e || b.y > H - e;
          if ((!b.entered || near) && Math.abs(angleDiff(b.target, inward)) > 1.1) b.target = inward;
        }
        const maxTurn = k.turn * (b.panic > 0 ? 2 : 1) * dt;

  }
  updateSpray(dt) {

      if (this.puffTimer <= 0) {
        this.puffTimer = 0.035;
        this.puffs.push({ x: this.touchPoint.x + rand(-6, 6), y: this.touchPoint.y + rand(-6, 6),
          vx: rand(-25, 25), vy: rand(-25, 25), maxR: this.spray.cloud * rand(0.75, 1), life: 1.1, age: 0 });
      }
    } else {

    }
  }
  mistDamage(dt) {
    for (let i = this.bugs.length - 1; i >= 0; i--) {
      const b = this.bugs[i];
      b.inMist = this.puffs.some((p) => p.age < p.life * 0.85 &&
        Math.hypot(b.x - p.x, b.y - p.y) < p.maxR * (0.45 + 0.55 * Math.min(1, p.age / 0.25)) + b.radius * 0.5);
      if (!b.inMist) continue;

    }
  }
  updateEffects(dt) {
    const age = (arr, life) => arr.filter((e) => (e.age += dt) < (typeof life === "function" ? life(e) : life));
    this.swats = age(this.swats, SWAT_DUR);
    for (const p of this.puffs) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; }
    this.puffs = age(this.puffs, (p) => p.life);

  }
  registerKill(b) {

    this.popups.push({ text: "+" + reward, x: b.x, y: b.y, color: PAL.gold, size: 22, age: 0 });
    if (this.combo >= 3) this.popups.push({ text: `COMBO x${this.combo}!`, x: b.x, y: b.y - 30, color: PAL.green, size: 26, age: 0 });

  }
  finish(won) {

    sfx(won ? "win" : "lose");
    ui.banner(won ? "SQUASHED!" : "TIME'S UP!", won ? "var(--green)" : "var(--roach)", false);
  }
  result() {
    const won = this.phase === "won";

      bounty: this.bounty, completion: won ? LEVEL.completionBonus : 0,
      timeBonus: won ? Math.floor(this.timeLeft) * LEVEL.timePerSecond : 0, stars };
  }
  draw(g) {
    for (const s of this.splats) drawSplat(g, s);
    for (const b of this.bugs) drawBug(g, b.kind, b.x, b.y, b.heading, b.lp, b.flash);
    for (const p of this.puffs) drawPuff(g, p, this.spray.color);
    for (const s of this.swats) drawSwat(g, s);
    if (this.spraying && this.touchPoint && this.phase === "playing") drawHeldCan(g, this.touchPoint.x, this.touchPoint.y, this.spray.color);
    for (const p of this.popups) drawPopup(g, p);
  }
}

function sizeCanvas(c) {
  const r = c.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 3);
  const w = Math.round(r.width * d), h = Math.round(r.height * d);
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  const g = c.getContext("2d"); g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, r.width, r.height);
  return [g, r.width, r.height];
}
const mascot = $("mascot");
function drawMascot(t) {
  const [g, w, h] = sizeCanvas(mascot);
  drawBug(g, "roach", w / 2, h / 2 + 8 + Math.sin(t * 2) * 3, -Math.PI / 2 - 0.4 + Math.sin(t * 0.8) * 0.05,
    Math.sin(t * 3) * 0.8, 0, Math.min(w, h) / 110);
}
function drawIcons() {
  document.querySelectorAll("canvas[data-bug]").forEach((c) => {
    const [g, w, h] = sizeCanvas(c);
    drawBug(g, c.dataset.bug, w / 2, h / 2 + w * 0.1, -Math.PI / 2 - 0.35, 0.8, 0, w / 100);
  });
}
function drawCanIcon(c, color) {
  const [g, w, h] = sizeCanvas(c);
  g.translate(w / 2, h / 2 + w * 0.04); g.rotate(0.25); g.scale(w / 95, w / 95); drawCan(g, color);
}
function drawSwatterIcon(c, color) {
  const [g, w, h] = sizeCanvas(c);
  g.translate(w * 0.42, h * 0.36); g.rotate(-0.6); drawSwatter(g, w * 0.27, color, w * 0.32);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 20); last = now;
  const t = now / 1000;
  sg.setTransform(DPR, 0, 0, DPR, 0, 0);
  sg.drawImage(floorCanvas, 0, 0, W, H);
  if (mode === "menu") { drawMenuBugs(sg, W, H, t); drawMascot(t); }
  if (game && (mode === "game" || mode === "results")) {
    if (mode === "game") game.tick(dt);
    game.draw(sg);
    if (mode === "game") ui.updateHud();
  }
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- input
const pointers = new Set();
function pos(e) { const r = stage.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
stage.addEventListener("pointerdown", (e) => {
  if (mode !== "game" || !game) return;
  e.preventDefault(); pointers.add(e.pointerId);
  try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  game.pointerDown(e.pointerId, ...pos(e));
});
stage.addEventListener("pointermove", (e) => { if (game && pointers.has(e.pointerId)) game.pointerMove(e.pointerId, ...pos(e)); });
const release = (e) => { pointers.delete(e.pointerId); if (game) game.pointerUp(e.pointerId); };
stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", release);
document.addEventListener("visibilitychange", () => { if (document.hidden) ui.pause(); });
document.addEventListener("gesturestart", (e) => e.preventDefault());

// ---------------------------------------------------------------- UI
const STAR_SVG = (on) => `<svg viewBox="0 0 24 24"><path d="M12 2.2l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17l-5.9 3.3 1.3-6.6L2.5 9.1l6.6-.8z" fill="${on ? "#ffc726" : "rgba(158,148,138,.45)"}" stroke="#291a14" stroke-width="2" stroke-linejoin="round"/></svg>`;
const SOUND_ON = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
const SOUND_OFF = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;

const screens = ["menu", "hud", "countdown", "bannerLayer", "pause", "results"];
function show(...ids) { for (const s of screens) $(s).hidden = !ids.includes(s); }

const ui = {
  lastHud: {},
  goMenu() {
    mode = "menu"; game = null; show("menu");
    $("menuCoins").textContent = save.coins;
    $("menuStars").innerHTML = [0, 1, 2].map((i) => STAR_SVG(i < save.stars)).join("");
    $("muteBtn").innerHTML = save.muted ? SOUND_OFF : SOUND_ON;
    $("muteBtn").setAttribute("aria-label", save.muted ? "Sound off" : "Sound on");
    requestAnimationFrame(drawIcons);
  },
  start() {
    $("shop").hidden = true;
    pointers.clear();
    game = new Game(W, H); mode = "game"; this.lastHud = {};
    show("hud", "countdown");
    $("countNum").textContent = "3";
    drawIcons(); drawCanIcon($("hudCan"), game.spray.color);
    $("tankFill").style.background = game.spray.color;
    $("hint").style.opacity = 1;
    sfx("tick");
  },
  onPlaying() { $("countdown").hidden = true; this.banner("SWAT!", "var(--gold)", true); },
  banner(text, color, autoHide) {
    const b = $("banner"); b.textContent = text; b.style.color = color;
    b.style.animation = "none"; void b.offsetWidth; b.style.animation = "";
    $("bannerLayer").hidden = false;
    clearTimeout(this.bannerTimer);
    if (autoHide) this.bannerTimer = setTimeout(() => { $("bannerLayer").hidden = true; }, 700);
  },
  updateHud() {
    const h = this.lastHud, set = (id, key, val, fn) => { if (h[key] !== val) { h[key] = val; fn($(id), val); } };
    if (game.phase === "countdown") set("countNum", "count", Math.max(1, Math.ceil(game.countdown)), (el, v) => {
      el.textContent = v; el.style.animation = "none"; void el.offsetWidth; el.style.animation = "";
    });
    set("timerText", "time", Math.ceil(game.timeLeft), (el, v) => { el.textContent = v; $("timer").classList.toggle("urgent", v <= 10); });
    set("hudCoins", "coins", game.bounty, (el, v) => (el.textContent = v));
    set("quotaText", "kills", game.kills, (el, v) => { el.textContent = `${v} / ${LEVEL.quota}`; $("quotaFill").style.width = Math.min(100, (v / LEVEL.quota) * 100) + "%"; });
    set("tankFill", "tank", Math.round(game.sprayFraction * 100), (el, v) => { el.style.height = v + "%"; el.style.background = v < 15 ? "var(--roach)" : game.spray.color; });
    set("hint", "hint", game.phase === "countdown" || (game.phase === "playing" && game.elapsed < 7), (el, v) => (el.style.opacity = v ? 1 : 0));
  },
  pause() {
    if (mode !== "game" || !game || !(game.phase === "playing" || game.phase === "countdown")) return;
    game.resumeTo = game.phase; game.phase = "paused";
    for (const id of [...pointers]) game.pointerUp(id); pointers.clear();
    $("pause").hidden = false;
  },
  resume() { if (game && game.phase === "paused") { game.phase = game.resumeTo; $("pause").hidden = true; } },
  showResults(r) {
    mode = "results";
    const total = r.bounty + r.completion + r.timeBonus;
    save.coins += total;
    if (r.stars > save.stars) save.stars = r.stars;
    persist();
    show("results");
    const title = $("resTitle"); title.textContent = r.won ? "LEVEL CLEAR!" : "TIME'S UP!"; title.style.color = r.won ? "var(--gold)" : "var(--roach)";
    $("resStars").innerHTML = [0, 1, 2].map((i) => STAR_SVG(i < r.stars)).join("");
    const row = (label, v, cls = "") => `<div class="r ${cls}"><span>${label}</span><span class="v">${v}</span></div>`;
    const coinRow = (label, v, cls = "") => `<div class="r ${cls}"><span>${label}</span><span class="v" style="display:flex;align-items:center;gap:6px"><span class="coin">$</span>+${v}</span></div>`;
    $("resStats").innerHTML = row("Bugs squashed", `${r.kills} / ${LEVEL.quota}`) + row("Got away", r.escaped) +
      row("Best combo", r.bestCombo >= 2 ? "x" + r.bestCombo : "-") + (r.won ? row("Time left", Math.floor(r.timeLeft) + "s") : "");
    $("resCoins").innerHTML = coinRow("Bug bounties", r.bounty) +
      (r.won ? coinRow("Level complete", r.completion) + coinRow("Speed bonus", r.timeBonus) : "") +
      coinRow("TOTAL", total, "total") + (r.won ? "" : `<div class="note">Spend your bounty on upgrades and try again!</div>`);
    $("resWallet").textContent = save.coins;
    $("againBtn").textContent = r.won ? "PLAY AGAIN" : "TRY AGAIN";
    $("nextBtn").hidden = !r.won;
    $("results").scrollTop = 0;
  },
  openShop() { $("shop").hidden = false; $("shop").scrollTop = 0; this.renderShop(); },
  closeShop() {
    $("shop").hidden = true;
    if (mode === "menu") this.goMenu(); else $("resWallet").textContent = save.coins;
  },
  renderShop() {
    $("shopCoins").textContent = save.coins;
    for (const kind of ["swatter", "spray"]) {
      const tiers = kind === "swatter" ? SWATTERS : SPRAYS, tier = save[kind], now = tiers[tier], next = tiers[tier + 1];
      const cost = COSTS[kind][tier], afford = cost !== undefined && save.coins >= cost;
      const stats = kind === "swatter"
        ? [["Swat size", (s) => s.radius], ["Swat power", (s) => s.damage.toFixed(1)]]
        : [["Tank (sec)", (s) => s.tank.toFixed(1)], ["Potency", (s) => s.dps.toFixed(1)], ["Cloud size", (s) => s.cloud]];
      $("card-" + kind).innerHTML = `
        <div class="head">
          <div class="ico"><canvas></canvas></div>
          <div style="min-width:0">
            <div class="eyebrow">${kind === "swatter" ? "Fly Swatter" : "Bug Spray"}</div>
            <div class="tname">${now.name}</div>
            <div class="pips">${tiers.map((_, i) => `<i class="${i <= tier ? "on" : ""}"></i>`).join("")}</div>
          </div>
        </div>
        <div class="rows">${stats.map(([label, f]) => `<div class="stat"><span>${label}</span><span class="now">${f(now)}</span>${next ? `<span aria-hidden="true">&rarr;</span><span class="next">${f(next)}</span>` : ""}</div>`).join("")}</div>
        ${cost === undefined ? `<div class="maxed">MAXED OUT!</div>`
          : `<button class="btn sm" style="--c: var(--green); align-self:center" data-buy="${kind}" ${afford ? "" : "disabled"}>UPGRADE <span class="coin">$</span>${cost}</button>`}`;
      const c = $("card-" + kind).querySelector("canvas");
      kind === "swatter" ? drawSwatterIcon(c, now.color) : drawCanIcon(c, now.color);
    }
  },
  buy(kind) {
    const cost = COSTS[kind][save[kind]];
    if (cost === undefined || save.coins < cost) return;
    save.coins -= cost; save[kind]++; persist(); sfx("win"); this.renderShop();
  },
};

$("playBtn").onclick = () => ui.start();
$("menuShopBtn").onclick = () => ui.openShop();
$("muteBtn").onclick = () => { save.muted = !save.muted; persist(); ui.goMenu(); };
$("pauseBtn").onclick = () => ui.pause();
$("resumeBtn").onclick = () => ui.resume();
$("quitBtn").onclick = () => { $("pause").hidden = true; ui.goMenu(); };
$("resShopBtn").onclick = () => ui.openShop();
$("againBtn").onclick = () => ui.start();
$("resMenuBtn").onclick = () => ui.goMenu();
$("shopDone").onclick = () => ui.closeShop();
$("shop").addEventListener("click", (e) => { const b = e.target.closest("[data-buy]"); if (b && !b.disabled) ui.buy(b.dataset.buy); });
function restoreReset() {
  $("resetArea").innerHTML = `<button class="link-btn" id="resetBtn">Reset progress</button>`;
  bindReset();
}
function bindReset() {
  $("resetBtn").onclick = () => {
    $("resetArea").innerHTML = `<div class="confirm"><span>Reset all coins and upgrades?</span><button class="danger" id="resetYes">Reset</button><button id="resetNo">Cancel</button></div>`;
    $("resetYes").onclick = () => { Object.assign(save, { coins: 0, swatter: 0, spray: 0, stars: 0 }); persist(); restoreReset(); ui.renderShop(); };
    $("resetNo").onclick = restoreReset;
  };
}
bindReset();

ui.goMenu();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawIcons);
requestAnimationFrame((t) => { last = t; frame(t); });
</script>
